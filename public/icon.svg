<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141419"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="tvGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e50914"/>
      <stop offset="50%" stop-color="#002D62"/>
      <stop offset="100%" stop-color="#e50914"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#e50914" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#27272a" stroke-width="4"/>

  <!-- TV Screen Outer Frame -->
  <rect x="76" y="96" width="360" height="260" rx="36" fill="#18181b" stroke="#3f3f46" stroke-width="8" filter="url(#shadow)"/>

  <!-- Dominican Flag Quadrants inside Screen -->
  <g clip-path="url(#screenClip)">
    <clipPath id="screenClip">
      <rect x="88" y="108" width="336" height="236" rx="28"/>
    </clipPath>

    <!-- Top Left: Blue -->
    <rect x="88" y="108" width="168" height="118" fill="#002D62"/>
    <!-- Top Right: Red -->
    <rect x="256" y="108" width="168" height="118" fill="#CE1126"/>
    <!-- Bottom Left: Red -->
    <rect x="88" y="226" width="168" height="118" fill="#CE1126"/>
    <!-- Bottom Right: Blue -->
    <rect x="256" y="226" width="168" height="118" fill="#002D62"/>

    <!-- Dominican White Cross -->
    <rect x="236" y="108" width="40" height="236" fill="#FFFFFF"/>
    <rect x="88" y="206" width="336" height="40" fill="#FFFFFF"/>

    <!-- Dark gradient overlay for cinema depth -->
    <rect x="88" y="108" width="336" height="236" fill="black" opacity="0.35"/>

    <!-- Center Play Icon -->
    <circle cx="256" cy="226" r="48" fill="#E50914" filter="url(#shadow)"/>
    <polygon points="244,204 278,226 244,248" fill="#FFFFFF"/>
  </g>

  <!-- TV Stand Base -->
  <path d="M216 364 L296 364 L326 414 L186 414 Z" fill="#27272a" stroke="#3f3f46" stroke-width="4"/>
  <rect x="166" y="412" width="180" height="16" rx="8" fill="#e50914"/>

  <!-- Badge Text "ELITVRD" -->
  <text x="256" y="468" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">
    ELITVRD
  </text>
  <text x="330" y="456" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="14" fill="#E50914" letter-spacing="1">
    LIVE
  </text>
</svg>
